name: flutter_ios_voip_kit_karmm
description: One-to-one video call using CallKit and PushKit with flutter ios app.
version: 0.8.0
homepage: https://github.com/masashi-sutou/flutter_ios_voip_kit

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterIOSVoIPKitPlugin
